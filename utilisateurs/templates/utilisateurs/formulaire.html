{% extends "base.html" %}
{% block title %}{{ titre }}{% endblock %}
{% block heading %}{{ titre }}{% endblock %}
{% block back_url %}{% url 'liste_utilisateurs' %}{% endblock %}
{% block content %}
<div class="panel">
    <form method="post" class="form-grid">
        {% csrf_token %}
        <div class="field">
            <label>Identifiant</label>
            <input name="username" required value="{{ utilisateur.username|default:'' }}">
        </div>
        <div class="field">
            <label>Prénom</label>
            <input name="first_name" value="{{ utilisateur.first_name|default:'' }}">
        </div>
        <div class="field">
            <label>Nom</label>
            <input name="last_name" value="{{ utilisateur.last_name|default:'' }}">
        </div>
        <div class="field">
            <label>Email</label>
            <input type="email" name="email" required value="{{ utilisateur.email|default:'' }}">
        </div>
        <div class="field">
            <label>Mot de passe{% if utilisateur %} <span class="muted">(laisser vide pour ne pas changer)</span>{% endif %}</label>
            <input type="password" name="password"{% if not utilisateur %} required{% endif %}>
        </div>
        <div class="field">
            <label>Rôle</label>
            <select name="role">
                {% for value, label in roles_possibles %}
                <option value="{{ value }}" {% if utilisateur and utilisateur.role == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <button class="btn" type="submit"><i class="bi bi-floppy"></i> Enregistrer</button>
    </form>
</div>
{% endblock %}
